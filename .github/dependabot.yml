version: 2
updates:
  # Python-Abhaengigkeiten in den requirements-Dateien.
  #
  # increase-if-necessary haelt die Untergrenzen in Ruhe: "pywebview>=5.0"
  # bedeutet "ab dieser Fassung funktioniert es" und nicht "diese Fassung wird
  # empfohlen". pip installiert ohnehin die neueste passende Version; eine
  # angehobene Untergrenze wuerde nur aeltere Umgebungen ausschliessen.
  # Angehoben werden damit allein die festen Fassungen in
  # requirements-build.txt - und die werden dann einmal bewusst geprueft,
  # statt unbemerkt in ein Release zu rutschen.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels: ["abhängigkeiten"]

  # Versionen der GitHub-Actions in den Workflows. Hier bleibt es bei der
  # Vorgabe: In den Workflows stehen genaue Fassungen, und bei der fremden
  # Action haengt Dependabot den Commit-Hash samt der Fassung im Kommentar mit.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["ci"]
